<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@NLS • Gemini-Powered Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div class="brand">
          <div class="brand__badge">@NLS</div>
          <div>
            <h1>ChatGPT-style Clone</h1>
            <p>Powered by Gemini API</p>
          </div>
        </div>
        <button id="clearBtn" class="ghost-button" type="button">Clear chat</button>
      </header>

      <main class="chat" id="chat"></main>

      <footer class="composer">
        <form id="chatForm" autocomplete="off">
          <label class="sr-only" for="prompt">Message</label>
          <textarea
            id="prompt"
            name="prompt"
            rows="1"
            placeholder="Message @NLS..."
            required
          ></textarea>
          <div class="composer__actions">
            <div class="status" id="status">Ready</div>
            <button id="sendBtn" class="primary-button" type="submit">Send</button>
          </div>
        </form>
      </footer>
    </div>

    <template id="messageTemplate">
      <article class="message">
        <div class="message__meta"></div>
        <div class="message__content"></div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
